## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. The tb-updater core suite (tb-updater-tests) is a
## pure-source structural guard for GUI mode, so it needs only pytest -- no Qt,
## no display. The install-based e2e suite runs from a separate workflow.
coverity:
  ## scan.coverity.com project name (org-ai-assisted-owned; the "/" is
  ## rejected in manual registration so the name is slash-free).
  project-name:    "org-ai-assisted-tb-updater"
  canonical-repos: "org-ai-assisted/tb-updater"

dist-ai-tests:
  apt-packages: "python3 python3-pytest"
  ## version-validator sources helper-scripts' strings.bsh / has.bsh by absolute
  ## path; provide helper-scripts at the repo-sibling path so shellcheck -x
  ## follows the '# shellcheck source=' directives in the isolated CI checkout
  ## (lets version-validator / unit_test drop their SC1091 / SC2154 disables).
  helper-scripts: true
